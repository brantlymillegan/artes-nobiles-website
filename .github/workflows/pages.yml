name: Deploy website to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Follow the repository's actual default branch (main or master).
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check out Flappy Pope
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: brantlymillegan/flappypope
          ref: main
          path: _flappypope
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Validate and assemble public website
        run: |
          node --check dist/theme.js
          node --check dist/logo.js
          node --check dist/navigation.js
          node --check dist/book-reader.js
          node --check dist/rosarium-video.js
          node --check dist/thechristmasstory/book-film.js
          node --check dist/thechristmasstory/book-navigation.js
          node --check dist/assets/vendor/page-flip-2.0.7.js
          node --check dist/assets/logo-motion.js
          python3 scripts/build_pages.py
      - name: Validate and include Flappy Pope
        run: |
          npm --prefix _flappypope run check
          npm --prefix _flappypope test
          test -f _flappypope/dist/index.html
          test ! -e _site/flappypope
          cp -R _flappypope/dist _site/flappypope
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload public website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
