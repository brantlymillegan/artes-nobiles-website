<svg xmlns="http://www.w3.org/2000/svg" width="160" height="36" viewBox="0 0 160 36">
  <title>Christmas Story - engraved geometric bottom ornament</title>
  <desc>Original fine-press vector ornament. Paired antique-gold rules, stepped wing panels, evergreen geometric inlays, and a faceted cranberry jewel echo the architectural side ornaments. Transparent background; no bitmap elements.</desc>
  <defs>
    <g id="left-wing">
      <g fill="none" stroke="#B58B4B" stroke-linejoin="miter">
        <!-- Stepped outer wing and its paired inner fillets. -->
        <path d="M8 18 H18 L24 12 H46 L52 18 H65 M18 18 L24 24 H46 L52 18" stroke-width=".62"/>
        <path d="M24 8.5 H40 M24 27.5 H40" stroke-width=".4"/>
        <path d="M26 15 H44 L47 18 L44 21 H26" stroke-width=".48"/>
        <path d="M51 13 H60 V16 H66 M51 23 H60 V20 H66" stroke-width=".48"/>
        <!-- Fine terminal and shoulder marks recall the vertical keywork. -->
        <path d="M8 15 V21 M12 16 V20 M55 10.5 V13 M55 23 V25.5" stroke-width=".4"/>
      </g>
      <!-- Two restrained engraved leaves; the mirrored wing supplies the matching pair. -->
      <g id="leaf-accents" fill="#B58B4B" fill-rule="evenodd">
        <path d="M55 13 C50 12.2 46.7 9 46 4.8 C50.8 6.3 54.2 9.5 55 13 Z M53.6 11.3 L47.9 6.6 L53.88 11.04 Z"/>
        <path d="M55 23 C50 23.8 46.7 27 46 31.2 C50.8 29.7 54.2 26.5 55 23 Z M53.6 24.7 L47.9 29.4 L53.88 24.96 Z"/>
      </g>
      <path d="M26.5 18 L30 16.7 H39.5 L42 18 L39.5 19.3 H30 Z" fill="#21483D"/>
      <circle cx="4.5" cy="18" r=".62" fill="#B58B4B"/>
      <circle cx="65.5" cy="18" r=".58" fill="#B58B4B"/>
    </g>
  </defs>
  <use href="#left-wing" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#left-wing"/>
  <use href="#left-wing" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#left-wing" transform="translate(160 0) scale(-1 1)"/>
  <!-- A reduced version of the side ornament's open, stepped cartouche. -->
  <g fill="none" stroke="#B58B4B" stroke-linejoin="miter">
    <path d="M80 6 L84.5 11 H88 V15 L91 18 L88 21 V25 H84.5 L80 30 L75.5 25 H72 V21 L69 18 L72 15 V11 H75.5 Z" stroke-width=".65"/>
    <path d="M80 11 L86.5 18 L80 25 L73.5 18 Z" stroke-width=".45"/>
    <path d="M69 18 H73.5 M86.5 18 H91 M80 6 V11 M80 25 V30" stroke-width=".38"/>
  </g>
  <path d="M80 13.8 L82.1 18 L80 22.2 L77.9 18 Z" fill="#982F3B"/>
</svg>

