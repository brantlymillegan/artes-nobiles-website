<svg xmlns="http://www.w3.org/2000/svg" class="christmas-star-logo" width="512" height="512" viewBox="-4 -4 56 56" role="img" aria-labelledby="star-title star-desc">
  <title id="star-title">The Christmas Story — a little Christmas twinkle</title>
  <desc id="star-desc">The original gold star immediately swells into a smooth turn while its ruby center twinkles. A few golden sparkles accompany the first turn, followed by a fuller shower of nine extra sparkles during the second turning movement. The animation loops every four seconds.</desc>
  <style>
    .christmas-star-logo .gold-star, .christmas-star-logo .ruby-core, .christmas-star-logo .ruby-twinkle {
      transform-box: view-box;
      transform-origin: 24px 24px;
    }
    .christmas-star-logo .gold-star { animation: christmas-gold 4s cubic-bezier(.4,0,.2,1) infinite; }
    .christmas-star-logo .ruby-core { animation: christmas-ruby 4s ease-in-out infinite; }
    .christmas-star-logo .ruby-twinkle { opacity: 0; animation: christmas-ruby-glint 4s ease-in-out infinite; }
    .christmas-star-logo .sparkle { opacity: 0; transform-box: fill-box; transform-origin: center; animation: christmas-sparkle 4s ease-in-out infinite; }
    .christmas-star-logo .sparkle-b { animation-delay: .04s; }
    .christmas-star-logo .sparkle-c { animation-delay: .08s; }
    .christmas-star-logo .sparkle-extra { animation-name: christmas-second-sparkles; }
    @keyframes christmas-second-sparkles {
      0%, 43%, 70%, 100% { opacity: 0; transform: scale(.08) rotate(-16deg); }
      50% { opacity: .65; transform: scale(.7) rotate(-6deg); }
      56% { opacity: 1; transform: scale(1.2) rotate(8deg); }
      61% { opacity: .8; transform: scale(.85) rotate(18deg); }
      66% { opacity: .15; transform: scale(.25) rotate(30deg); }
    }
    @keyframes christmas-gold {
      0% { transform: rotate(0deg) scale(1); filter: drop-shadow(0 0 0px #DABB7B00); animation-timing-function: cubic-bezier(.2,.65,.3,1); }
      8% { transform: rotate(28deg) scale(1.32); filter: drop-shadow(0 0 1px #DABB7B55); }
      24% { transform: rotate(95deg) scale(1.15); filter: drop-shadow(0 0 .5px #DABB7B33); }
      38% { transform: rotate(145deg) scale(1.2); filter: drop-shadow(0 0 1px #DABB7B55); }
      68% { transform: rotate(325deg) scale(.93); filter: drop-shadow(0 0 .3px #DABB7B22); }
      84%, 100% { transform: rotate(360deg) scale(1); filter: drop-shadow(0 0 0px #DABB7B00); }
    }
    @keyframes christmas-ruby {
      0% { transform: scale(1); animation-timing-function: cubic-bezier(.2,.65,.3,1); }
      8% { transform: scale(2.35); }
      22% { transform: scale(1.75); }
      82%, 100% { transform: scale(1); }
      34% { transform: scale(2.35); }
      46% { transform: scale(1.75); }
      58% { transform: scale(2.1); }
      69% { transform: scale(1.45); }
    }
    @keyframes christmas-ruby-glint {
      0% { opacity: 0; transform: scale(.4) rotate(-12deg); animation-timing-function: cubic-bezier(.2,.65,.3,1); }
      7% { opacity: .95; transform: scale(1) rotate(0deg); }
      20%, 44%, 48%, 76%, 100% { opacity: 0; transform: scale(.4) rotate(-12deg); }
      31% { opacity: .95; transform: scale(1) rotate(0deg); }
      60% { opacity: .8; transform: scale(.78) rotate(12deg); }
    }
    @keyframes christmas-sparkle {
      0% { opacity: 0; transform: scale(.15) rotate(-18deg); animation-timing-function: cubic-bezier(.2,.65,.3,1); }
      8% { opacity: .9; transform: scale(1) rotate(0deg); }
      22%, 26%, 55%, 100% { opacity: 0; transform: scale(.15) rotate(-18deg); }
      38% { opacity: .9; transform: scale(1) rotate(0deg); }
      46% { opacity: .55; transform: scale(.68) rotate(12deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .christmas-star-logo .gold-star, .christmas-star-logo .ruby-core, .christmas-star-logo .ruby-twinkle, .christmas-star-logo .sparkle { animation: none; }
      .christmas-star-logo .ruby-twinkle, .christmas-star-logo .sparkle { opacity: 0; }
    }
  </style>
  <!-- Original gold artwork, with its exact geometry and color. -->
  <g class="gold-star">
    <path d="M24 5 L26.1 20.3 L35.3 12.7 L27.7 21.9 L43 24 L27.7 26.1 L35.3 35.3 L26.1 27.7 L24 43 L21.9 27.7 L12.7 35.3 L20.3 26.1 L5 24 L20.3 21.9 L12.7 12.7 L21.9 20.3 Z" fill="#AF8E54"/>
    <path d="M24 9 L24 39 M9 24 L39 24" fill="none" stroke="#AF8E54" stroke-width="0.3"/>
  </g>
  <!-- Original ruby diamond, kept separate so it pulses independently. -->
  <g class="ruby-core">
    <path d="M24 21.7 L26.3 24 L24 26.3 L21.7 24 Z" fill="#982F3B"/>
  </g>
  <g class="ruby-twinkle" fill="#FFF7DD">
    <path d="M22.1 19.2 L22.5 21.1 L24.4 21.5 L22.5 21.9 L22.1 23.8 L21.7 21.9 L19.8 21.5 L21.7 21.1 Z"/>
    <path d="M26.5 25.1 L26.7 26 L27.6 26.2 L26.7 26.4 L26.5 27.3 L26.3 26.4 L25.4 26.2 L26.3 26 Z"/>
  </g>
  <g fill="#D4AF64" aria-hidden="true">
    <path class="sparkle sparkle-a" d="M7 5 L7.55 7.45 L10 8 L7.55 8.55 L7 11 L6.45 8.55 L4 8 L6.45 7.45 Z"/>
    <path class="sparkle sparkle-b" d="M40.5 4 L40.95 6.05 L43 6.5 L40.95 6.95 L40.5 9 L40.05 6.95 L38 6.5 L40.05 6.05 Z"/>
    <path class="sparkle sparkle-c" d="M42 37.5 L42.5 40 L45 40.5 L42.5 41 L42 43.5 L41.5 41 L39 40.5 L41.5 40 Z"/>
  </g>
  <!-- A richer second burst: nine additional twinkles, appearing only during the later turn. -->
  <g aria-hidden="true">
    <path class="sparkle sparkle-extra" style="animation-delay:-0.14s" d="M 13 -0.6 L 13.432 1.368 L 15.4 1.8 L 13.432 2.232 L 13 4.2 L 12.568 2.232 L 10.6 1.8 L 12.568 1.368 Z" fill="#D4AF64"/>
    <path class="sparkle sparkle-extra" style="animation-delay:-0.06s" d="M 31 -0.8 L 31.378 0.922 L 33.1 1.3 L 31.378 1.678 L 31 3.4 L 30.622 1.678 L 28.9 1.3 L 30.622 0.922 Z" fill="#AF8E54"/>
    <path class="sparkle sparkle-extra" style="animation-delay:0.04s" d="M 45 4.4 L 45.468 6.532 L 47.6 7 L 45.468 7.468 L 45 9.6 L 44.532 7.468 L 42.4 7 L 44.532 6.532 Z" fill="#C9A05B"/>
    <path class="sparkle sparkle-extra" style="animation-delay:0.12s" d="M 48 20.7 L 48.414 22.586 L 50.3 23 L 48.414 23.414 L 48 25.3 L 47.586 23.414 L 45.7 23 L 47.586 22.586 Z" fill="#D4AF64"/>
    <path class="sparkle sparkle-extra" style="animation-delay:0.2s" d="M 43 39 L 43.54 41.46 L 46 42 L 43.54 42.54 L 43 45 L 42.46 42.54 L 40 42 L 42.46 41.46 Z" fill="#AF8E54"/>
    <path class="sparkle sparkle-extra" style="animation-delay:0.28s" d="M 27 44.9 L 27.468 47.032 L 29.6 47.5 L 27.468 47.968 L 27 50.1 L 26.532 47.968 L 24.4 47.5 L 26.532 47.032 Z" fill="#C9A05B"/>
    <path class="sparkle sparkle-extra" style="animation-delay:0.36s" d="M 10 42.2 L 10.504 44.496 L 12.8 45 L 10.504 45.504 L 10 47.8 L 9.496 45.504 L 7.2 45 L 9.496 44.496 Z" fill="#D4AF64"/>
    <path class="sparkle sparkle-extra" style="animation-delay:0.16s" d="M 0.5 28.75 L 0.905 30.595 L 2.75 31 L 0.905 31.405 L 0.5 33.25 L 0.095 31.405 L -1.75 31 L 0.095 30.595 Z" fill="#AF8E54"/>
    <path class="sparkle sparkle-extra" style="animation-delay:0.08s" d="M 1.5 10.9 L 1.878 12.622 L 3.6 13 L 1.878 13.378 L 1.5 15.1 L 1.122 13.378 L -0.6 13 L 1.122 12.622 Z" fill="#C9A05B"/>
  </g>
</svg>
