<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-3 -5 31 31" shape-rendering="crispEdges" role="img" aria-labelledby="pope-title pope-description">
  <title id="pope-title">Flappy Pope — a backflip and a little flight</title>
  <desc id="pope-description">The original pixel Pope immediately performs a smooth backward somersault, then flaps his wings twice and softly settles. A four-second loop.</desc>
  <style>
    /* Start the backflip immediately; the two wingbeats follow after the turn is complete. */
    .pope-somersault { animation: pope-somersault 4s infinite; transform-box: view-box; transform-origin: 12px 12px; }
    .pope-flight { animation: pope-flight 4s infinite; transform-origin: 16px 13px; }
    .pope-wing-front { animation: pope-wing-front 4s ease-in-out infinite; }
    .pope-wing-back { animation: pope-wing-back 4s ease-in-out infinite; }
    @keyframes pope-flight {
      0% { transform: translateY(0) rotate(0deg) scale(1); animation-timing-function: cubic-bezier(.2,.65,.3,1); }
      8% { transform: translateY(-1.4px) rotate(0deg) scale(1.2); animation-timing-function: ease-in-out; }
      24% { transform: translateY(-0.8px) rotate(0deg) scale(1.1); animation-timing-function: ease-out; }
      30% { transform: translateY(-1.4px) rotate(-17.2deg) scale(1.16); animation-timing-function: ease-in-out; }
      38% { transform: translateY(-1.4px) rotate(-12deg) scale(1.1); animation-timing-function: ease-out; }
      46% { transform: translateY(-2px) rotate(-17.2deg) scale(1.16); animation-timing-function: ease-in-out; }
      60% { transform: translateY(-1.9px) rotate(-4deg) scale(1); animation-timing-function: ease-in; }
      70% { transform: translateY(0.25px) rotate(9deg) scale(1); animation-timing-function: ease-out; }
      84% { transform: translateY(0) rotate(0deg) scale(1); animation-timing-function: ease-out; }
      89% { transform: translateY(0.2px) rotate(0deg) scale(1); animation-timing-function: ease-in-out; }
      94%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    }
    @keyframes pope-somersault {
      0% { transform: rotate(0deg); animation-timing-function: cubic-bezier(.3,.5,.35,1); }
      24%, 100% { transform: rotate(-360deg); }
    }
    @keyframes pope-wing-front {
      0%, 24%, 38%, 58%, 100% { transform: translateY(0); }
      30%, 46% { transform: translateY(5px); }
    }
    @keyframes pope-wing-back {
      0%, 24%, 38%, 58%, 100% { transform: translateY(0); }
      30%, 46% { transform: translateY(-5px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pope-somersault, .pope-flight, .pope-wing-front, .pope-wing-back { animation: none; }
    }
  </style>
